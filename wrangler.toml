name = "teeling"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# Reminder delivery: checks for pending reminders every minute.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "teeling"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "teeling"

[vars]
# ANTHROPIC_API_KEY is managed via `wrangler secret put ANTHROPIC_API_KEY` (not defined
# here in [vars], since that would overwrite the secret with an empty string on deploy).
# Mock AI mode for local development (can be overridden via .dev.vars).
MOCK_AI = "false"

# Used for local development (`bun dev` = vite dev's platformProxy; svelte.config.js sets
# environment = "local"). Named environments don't inherit d1_databases/kv_namespaces/
# r2_buckets from the top level, so every field is redefined here.
# database_id/id can be dummy values; local D1/KV are created under .wrangler/state,
# fully separate from the real production IDs above.
[[env.local.d1_databases]]
binding = "DB"
database_name = "teeling"
database_id = ""
migrations_dir = "drizzle"

[[env.local.kv_namespaces]]
binding = "KV"
id = "dummy"

[[env.local.r2_buckets]]
binding = "R2"
bucket_name = "teeling"

[env.local.vars]
MOCK_AI = "false"

name = "teeling"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# リマインダー配信: pending な reminders を1分ごとにチェック
# 承認待ちサマリー: 毎週月曜 0:00 UTC (9:00 JST) に承認担当者へ配信
[triggers]
crons = ["* * * * *", "0 0 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "teeling"
database_id = "b2006c75-6104-4a22-b4e8-7cae37fe80a4"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "198498033a0b4c69b9b2f4220feaf66e"

[[r2_buckets]]
binding = "R2"
bucket_name = "teeling"

[vars]
# ANTHROPIC_API_KEY は `wrangler secret put ANTHROPIC_API_KEY` で管理する（[vars] に書くと deploy 時にシークレットを空文字で上書きしてしまうため定義しない）
# ローカル開発時のモックモード（.dev.vars で上書き可能）
MOCK_AI = "false"

name = "teeling"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# リマインダー配信: pending な reminders を1分ごとにチェック
# 承認待ちサマリー: 毎週月曜 0:00 UTC (9:00 JST) に承認担当者へ配信
[triggers]
crons = ["* * * * *", "0 0 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "teeling"
database_id = "b2006c75-6104-4a22-b4e8-7cae37fe80a4"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "198498033a0b4c69b9b2f4220feaf66e"

[[r2_buckets]]
binding = "R2"
bucket_name = "teeling"

[vars]
# ANTHROPIC_API_KEY は `wrangler secret put ANTHROPIC_API_KEY` で管理する（[vars] に書くと deploy 時にシークレットを空文字で上書きしてしまうため定義しない）
# ローカル開発時のモックモード（.dev.vars で上書き可能）
MOCK_AI = "false"

# ローカル開発 (`bun dev` = vite dev の platformProxy、svelte.config.js で environment = "local" を指定) 用。
# 名前付き environment の d1_databases/kv_namespaces/r2_buckets は上位の設定を継承しないため全項目を再定義している。
# database_id/id はダミー値でよく、.wrangler/state にローカル用のD1/KVが作成される（本番の実IDとは分離される）。
[[env.local.d1_databases]]
binding = "DB"
database_name = "teeling"
database_id = ""
migrations_dir = "drizzle"

[[env.local.kv_namespaces]]
binding = "KV"
id = "dummy"

[[env.local.r2_buckets]]
binding = "R2"
bucket_name = "teeling"

[env.local.vars]
MOCK_AI = "false"
